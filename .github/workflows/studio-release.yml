# Builds SatCAD Studio for macOS (Apple silicon) and Windows (64-bit) and, when you push a tag like v0.3.0, publishes a GitHub Release.
# You can also run it by hand (Actions tab -> "Build SatCAD Studio" -> Run workflow) to get the files as downloadable artifacts only.
name: Build SatCAD Studio

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run the Studio tests
        run: python -m pytest tests/test_studio.py -q

      - name: Package the app
        run: python -m PyInstaller --noconfirm studio.spec

      - name: Smoke-test the packaged app (macOS)
        if: runner.os == 'macOS'
        run: python tools/smoke_test_app.py "dist/SatCAD Studio.app/Contents/MacOS/SatCAD Studio"

      - name: Smoke-test the packaged app (Windows)
        if: runner.os == 'Windows'
        run: python tools/smoke_test_app.py "dist/SatCAD Studio/SatCAD Studio.exe"

      - name: Make the macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir stage
          cp -R "dist/SatCAD Studio.app" stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname "SatCAD Studio" -srcfolder stage -ov -format UDZO "SatCAD-Studio-${VERSION}-macos-arm64.dmg"

      - name: Make the Windows installer
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=${VERSION}" studio.iss
          mv installer/*.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.label }}
          path: |
            SatCAD-Studio-*.dmg
            SatCAD-Studio-*-setup.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la files
          gh release create "$GITHUB_REF_NAME" files/* --title "SatCAD Studio ${GITHUB_REF_NAME#v}" --notes-file docs/RELEASE_NOTES.md
